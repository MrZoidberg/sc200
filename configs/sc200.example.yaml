# Shared startup, check-config and discovery destination: /etc/sc200/config.yaml
# Initial settings require hardware commissioning under real workload.
# See docs/operations.md and docs/hardware.md in the source repository.
# Restart the service after any changes; configuration is not hot-reloaded.
# Read telemetry and log simulated commands without changing fan speeds.
dry_run: false
http:
  listen: 127.0.0.1:9700
shutdown_timeout: 5s
# Installed separately as /etc/sc200/config.example.yaml, never as active config.
# Leave config.yaml absent for first discovery: sudo sc200 discover --write.
# To configure manually, copy this example and enable/edit at least one device.
# Validation intentionally rejects a configuration without an enabled device.
enclosures:
  - id: enclosure-1
    enabled: false
    # Prefer the discovered /dev/serial/by-id path when available.
    port: /dev/ttyS0
    baud: 38400
    poll_interval: 10s
    command_timeout: 2s
    stale_after: 30s
    refresh_interval: 30s
    cooldown: 30s
    reconnect_min: 1s
    reconnect_max: 30s
    recovery_samples: 3
    min_speed: 20
    safe_speed: 100
    critical_temperature: 45
    hysteresis: 2
    # Omit required_sensors to remember all initially installed sensors.
    # Discovery writes actual indices; do not assume the sample sensor count.
    curve:
      - {temperature: 25, speed: 20}
      - {temperature: 30, speed: 30}
      - {temperature: 35, speed: 50}
      - {temperature: 40, speed: 75}
      - {temperature: 45, speed: 100}
